         exact path: apps/tasks/public/apple-touch-icon.png (180x180, no
         transparency; iOS applies its own rounded-corner mask). -->
    <link rel="apple-touch-icon" href="/summit-app/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="theme-color" content="#f7f7f5" />
