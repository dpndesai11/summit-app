name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/package-lock.json
      # apps/ is the npm workspace root (core + portal + daily + fitness + eat + habits),
      # so one install and one test run cover every app and the shared package.
      - run: npm ci
        working-directory: apps
      - run: npm test
        working-directory: apps
      # Each app builds with its own base path (/summit-app/ for the portal, then
      # /summit-app/planner/, /fitness/, /eat/), so their outputs can be dropped into one Pages site.
      - run: npm run build
        working-directory: apps
        env:
          VITE_GITHUB_OWNER: ${{ secrets.VITE_GITHUB_OWNER }}
          VITE_GITHUB_REPO: ${{ secrets.VITE_GITHUB_REPO }}
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
          VITE_APP_PASSWORD: ${{ secrets.VITE_APP_PASSWORD }}
      - name: Assemble the site (portal at the root, the apps in subfolders)
        run: |
          mkdir -p site/planner site/fitness site/eat site/habits
          cp -r apps/portal/dist/. site/
          cp -r apps/daily/dist/. site/planner/
          cp -r apps/fitness/dist/. site/fitness/
          cp -r apps/eat/dist/. site/eat/
          cp -r apps/habits/dist/. site/habits/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
