name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/tasks/package-lock.json
      - run: npm ci
        working-directory: apps/tasks
      - run: npm run build
        working-directory: apps/tasks
        env:
          VITE_GITHUB_OWNER: ${{ secrets.VITE_GITHUB_OWNER }}
          VITE_GITHUB_REPO: ${{ secrets.VITE_GITHUB_REPO }}
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
          VITE_APP_PASSWORD: ${{ secrets.VITE_APP_PASSWORD }}
      - run: npm ci
        working-directory: apps/fitness
      - run: npm run build
        working-directory: apps/fitness
        env:
          VITE_GITHUB_OWNER: ${{ secrets.VITE_GITHUB_OWNER }}
          VITE_GITHUB_REPO: ${{ secrets.VITE_GITHUB_REPO }}
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
      - run: npm ci
        working-directory: apps/eat
      - run: npm run build
        working-directory: apps/eat
        env:
          VITE_GITHUB_OWNER: ${{ secrets.VITE_GITHUB_OWNER }}
          VITE_GITHUB_REPO: ${{ secrets.VITE_GITHUB_REPO }}
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
      - run: |
          mkdir -p apps/tasks/dist/fitness apps/tasks/dist/eat
          cp -r apps/fitness/dist/. apps/tasks/dist/fitness/
          cp -r apps/eat/dist/. apps/tasks/dist/eat/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/tasks/dist
      - uses: actions/deploy-pages@v4
        id: deployment
